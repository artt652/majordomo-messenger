<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111318">
<title>Majordomo Message</title>
<style>
:root{color-scheme:dark;--blue:#61dafb;--bg:#20232a;--ink:#f5f7fa;--muted:#aeb6c2;--card:#282c34;--field:#20232a;--border:#454b57;--row-border:#3b414c;--shadow:0 8px 28px #0005;--danger-bg:#30262a;--danger-border:#69424a;--danger-pressed:#493037;--toast-bg:#f5f7fa;--toast-ink:#20232a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);color-scheme:dark}
#home{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.panel{width:min(100%,440px);margin:auto}
.brand{font-size:27px;font-weight:750;letter-spacing:-.5px;text-align:center;color:var(--blue);margin-bottom:8px}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:0 0 28px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;font-weight:650;margin:0 0 8px}
.field{display:flex;gap:8px}
input{min-width:0;flex:1;border:1px solid var(--border);border-radius:12px;padding:13px 12px;font:inherit;font-size:15px;outline:none;background:var(--field);color:var(--ink)}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3f51b51a}
button{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:0 16px;font:inherit;font-weight:650;min-height:46px}
button:active{opacity:.8}
#message{font-size:13px;color:var(--muted);min-height:20px;margin-top:12px}
.section-title{font-size:13px;font-weight:700;margin:22px 0 8px}
#recent{display:flex;flex-direction:column;gap:6px}
.recent-row{display:flex;align-items:stretch;gap:6px}
.recent-item{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--row-border);border-radius:12px;padding:11px 12px;min-height:44px;font-size:13px;font-weight:500}
.recent-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.recent-item small{color:var(--muted);font-size:11px}
.delete-address{flex:0 0 44px;min-width:44px;min-height:44px;padding:0;border:1px solid var(--danger-border);border-radius:12px;background:var(--danger-bg);color:#bd3434;font-size:20px;line-height:1}
.delete-address:active{background:var(--danger-pressed)}
.scan-qr{width:100%;margin-top:10px;border:1px solid var(--border);background:transparent;color:var(--blue);min-height:44px}
.diagnostics-option{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;font-weight:500;color:var(--muted);line-height:1.4}
.diagnostics-option input{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--blue)}
@media (prefers-color-scheme: dark){.scan-qr{border-color:#454b57;color:#61dafb;background:#20232a}}
.footer{text-align:center;color:#9095a5;font-size:11px;margin-top:20px}
#viewer{display:none;position:fixed;inset:0;background:var(--card)}
#site{border:0;width:100%;height:100%;display:block;background:var(--card)}
#loading{position:absolute;left:0;right:0;top:0;height:3px;background:#e7e9f5;overflow:hidden;display:none}
#loading:after{content:"";display:block;height:100%;width:35%;background:var(--blue);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
@media (prefers-color-scheme: dark){
 :root{color-scheme:dark;--blue:#61dafb;--bg:#20232a;--ink:#f5f7fa;--muted:#aeb6c2;--card:#282c34;--field:#20232a;--border:#454b57;--row-border:#3b414c;--shadow:0 8px 28px #0005;--danger-bg:#30262a;--danger-border:#69424a;--danger-pressed:#493037;--toast-bg:#f5f7fa;--toast-ink:#20232a}
 .brand{color:#61dafb}
 input:focus{border-color:#61dafb;box-shadow:0 0 0 3px #61dafb24}
 button{background:#61dafb;color:#20232a}
 .recent-item{background:#282c34}
 .delete-address{color:#ff9298}
 #loading{background:#3b414c}
 #loading:after{background:#61dafb}
 .footer{color:#8e98a7}
 .card{background:#282c34}
}

#toast{position:fixed;left:16px;right:16px;bottom:20px;background:var(--toast-bg);color:var(--toast-ink);padding:13px 16px;border-radius:12px;font-size:13px;display:none;box-shadow:0 4px 18px #0002}
</style>
</head>
<body>
<main id="home">
 <div class="panel">
  <div class="brand">Majordomo Message</div>
  <p class="subtitle">Быстрый доступ к вашему серверу</p>
  <section class="card">
   <label for="url">Адрес сервера или сайта</label>
   <div class="field">
    <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://my-server.example">
    <button id="open">Открыть</button>
   </div>
   <div id="message">Введите адрес, чтобы открыть сайт в полноэкранном режиме.</div>
   <button id="scan-qr" class="scan-qr" type="button">▦ Сканировать QR-код</button>
   <label class="diagnostics-option" for="media-diagnostics">
    <input id="media-diagnostics" type="checkbox">
    <span>Включить диагностику камеры и микрофона</span>
   </label>
  </section>
  <div class="section-title">Недавние адреса</div>
  <div id="recent"></div>
  <div class="footer">Страница запуска · без адресной строки во время просмотра</div>
 </div>
</main>
<section id="viewer" aria-label="Сайт">
 <div id="loading"></div>
 <iframe id="site" title="Открытый сайт" allow="camera; microphone; clipboard-read; clipboard-write; autoplay; fullscreen" allowfullscreen></iframe>
</section>
<div id="toast"></div>
<script>
(function(){
 const home=document.getElementById('home'), viewer=document.getElementById('viewer'), input=document.getElementById('url'), openBtn=document.getElementById('open'), recent=document.getElementById('recent'), message=document.getElementById('message'), site=document.getElementById('site'), loading=document.getElementById('loading'), toast=document.getElementById('toast');
 const scanQrBtn=document.getElementById('scan-qr');
 const diagnosticsCheckbox=document.getElementById('media-diagnostics');
 diagnosticsCheckbox.addEventListener('change',()=>{try{if(window.MajordomoApp&&typeof MajordomoApp.setMediaDiagnosticsEnabled==='function'){MajordomoApp.setMediaDiagnosticsEnabled(diagnosticsCheckbox.checked)}else{showToast('Настройка диагностики доступна в приложении Android')}}catch(e){showToast('Не удалось изменить настройку диагностики')}});
 const colorScheme=window.matchMedia('(prefers-color-scheme: dark)');
 function applySystemTheme(){const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content='#111318';}
 applySystemTheme();
 const KEY='majordomo_recent_urls';
 let retryTimer=null, toastTimer=null, currentUrl='';
 function readRecent(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>typeof x==='string').slice(0,10)}catch(e){return []}}
 function saveRecent(url){let list=readRecent().filter(x=>x!==url);list.unshift(url);try{localStorage.setItem(KEY,JSON.stringify(list.slice(0,10)))}catch(e){};renderRecent()}
 function hostLabel(url){try{return new URL(url).host}catch(e){return url}}
 function renderRecent(){recent.innerHTML='';const list=readRecent();if(!list.length){const empty=document.createElement('div');empty.style.cssText='color:#8b90a0;font-size:13px;padding:8px 2px';empty.textContent='Здесь появятся адреса, которые вы открывали.';recent.appendChild(empty);return}
 list.forEach(url=>{const row=document.createElement('div');row.className='recent-row';const b=document.createElement('button');b.className='recent-item';b.type='button';const icon=document.createElement('small');icon.textContent='↗';const text=document.createElement('span');text.textContent=url;b.append(icon,text);b.addEventListener('click',()=>{input.value=url;openSite(url)});const del=document.createElement('button');del.className='delete-address';del.type='button';del.textContent='×';del.setAttribute('aria-label','Удалить адрес '+url);del.title='Удалить адрес';del.addEventListener('click',()=>removeRecent(url));row.append(b,del);recent.appendChild(row)})}
 function removeRecent(url){const list=readRecent().filter(item=>item!==url);try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){};if(currentUrl===url){currentUrl='';}renderRecent();showToast('Адрес удалён')}
 function normalize(raw){let value=String(raw||'').trim();if(!value)return null;if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(value))value='https://'+value;try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||!u.hostname)return null;return u.href}catch(e){return null}}
 function showToast(text){toast.textContent=text;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',2600)}
 function setBusy(busy){loading.style.display=busy?'block':'none'}
 function cancelRetry(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}}
 function openSite(raw, isRetry){const url=normalize(raw);if(!url){message.textContent='Введите корректный адрес, например https://example.com';input.focus();return}
 cancelRetry();currentUrl=url;input.value=url;message.textContent='Открываем '+hostLabel(url)+'…';saveRecent(url);
 try {
   if(window.MajordomoApp && typeof MajordomoApp.openSite==='function'){MajordomoApp.openSite(url);return}
   message.textContent='Обновите приложение до последней версии, чтобы открыть сайт.';
 } catch(e) { message.textContent='Не удалось открыть сайт. Попробуйте ещё раз.'; }
 }
 function scheduleRetry(url){
   cancelRetry();
   if(!url) return;
   retryTimer=setTimeout(()=>{retryTimer=null;message.textContent='Повторное подключение к '+hostLabel(url)+'…';openSite(url,true)},10000);
 }
 function returnHome(reason,url){
   const failedUrl=url||currentUrl;
   setBusy(false);viewer.style.display='none';home.style.display='flex';site.src='about:blank';
   input.value=failedUrl||'';message.textContent=reason||'Сайт недоступен. Повторим подключение через 10 секунд.';
   showToast('Сайт недоступен — повторим подключение через 10 секунд');
   scheduleRetry(failedUrl);
 }
 scanQrBtn.addEventListener('click',()=>{try{if(window.MajordomoApp&&typeof MajordomoApp.scanQr==='function'){MajordomoApp.scanQr()}else{message.textContent='Сканирование QR-кода доступно в приложении Android.'}}catch(e){message.textContent='Не удалось запустить сканер QR-кода.'}});
 openBtn.addEventListener('click',()=>openSite(input.value));
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();openSite(input.value)}});
 site.addEventListener('load',()=>{setBusy(false);try{if(window.MajordomoApp)MajordomoApp.setActiveUrl(currentUrl)}catch(e){}});
 window.majordomoQrResult=function(value){const scanned=String(value||'').trim();if(!scanned)return;input.value=scanned;message.textContent='QR-код распознан. Проверьте адрес и нажмите «Открыть».';input.focus()};
 window.majordomoLoad=function(url){openSite(url)};
 window.majordomoShowError=function(url,reason){currentUrl=url||currentUrl;returnHome('Не удалось открыть сайт: '+reason+'\nПроверьте адрес и подключение.',url||currentUrl)};
 window.majordomoInvalidUrl=function(){message.textContent='Проверьте адрес: нужен адрес сайта с http:// или https://';home.style.display='flex';viewer.style.display='none'};
 window.majordomoGoBack=function(){if(viewer.style.display==='block'){try{site.contentWindow.history.back()}catch(e){returnHome('Возврат на главную страницу',currentUrl)}}else{input.focus()}};
 window.addEventListener('message',e=>{if(e.data&&e.data.type==='majordomo-error')returnHome('Сайт сообщил об ошибке.',currentUrl)});
 renderRecent();
 // Automatically reopen the last-used server when the app starts.
 const savedAddress=readRecent()[0];
 if(savedAddress){
   input.value=savedAddress;
   message.textContent='Автоматическое подключение к '+hostLabel(savedAddress)+'…';
   setTimeout(()=>openSite(savedAddress),350);
 }
})();
</script>
</body>
</html>
